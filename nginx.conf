server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip compression ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ─── Static assets (no content hashes) ────────────────
    # Without hashed filenames, use short cache + must-revalidate
    # so K8s rolling updates pick up new files quickly.
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Images/fonts — these rarely change, cache longer
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp3|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─── index.html — never cache ─────────────────────────
    # The entry point must always be fresh so the browser
    # fetches the latest JS/CSS references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ─── SPA fallback — Angular Router ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
