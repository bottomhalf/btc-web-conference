<!-- Screen Share View Component -->
<!-- Only displays screen share content - participant roster is in meeting.component -->
<div class="screenshare-container">
    <!-- Screen share video (Local or Remote) - always in DOM, visibility controlled by CSS -->
    <video #screenPreview autoplay playsinline muted 
        [ngClass]="{'d-none': !isMyshareScreen && remoteSharescreenTrack() == null}"
        [ngStyle]="{'height': !meetingService.isMinimized() ? 'calc(100vh - 64px)' : '100%'}"
        style="width: 100%; border: 2px solid #007bff; border-radius: 8px; object-fit: contain;">
    </video>
</div>
